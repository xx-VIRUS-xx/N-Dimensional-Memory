services:
  graphiti-db:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/change-me
    ports: ["7474:7474","7687:7687"]
    volumes: [graphiti_neo4j:/data]
  graphiti:
    image: ghcr.io/getzep/graphiti:latest
    environment:
      NEO4J_URI: bolt://graphiti-db:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: change-me
    depends_on: [graphiti-db]
volumes:
  graphiti_neo4j:
