services:
  neo4j:
    image: neo4j:5.26.2
    container_name: v771-graphiti-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - graphiti_neo4j_data:/data
      - graphiti_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  graphiti_neo4j_data:
  graphiti_neo4j_logs:
